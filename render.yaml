services:
  - type: web
    name: carnatic-ragam-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: GROQ_API_KEY
        sync: false   # Set this manually in the Render dashboard → Environment tab
      - key: PYTHON_VERSION
        value: "3.11"
